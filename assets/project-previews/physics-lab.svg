<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="physics-lab-title physics-lab-desc">
  <title id="physics-lab-title">Physics Lab Simulation Diagram</title>
  <desc id="physics-lab-desc">Technical vector schematic showing 2D projectile trajectory with velocity vectors on a coordinate grid alongside a spring-mass simple harmonic oscillator.</desc>
  <defs>
    <pattern id="pl-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1b2330" stroke-width="1"/>
    </pattern>
    <marker id="pl-arrow-green" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#39d353"/>
    </marker>
    <marker id="pl-arrow-cyan" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#58a6ff"/>
    </marker>
    <marker id="pl-arrow-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#ff9f43"/>
    </marker>
  </defs>

  <rect width="640" height="380" rx="6" fill="#0d1117"/>
  <rect width="640" height="380" rx="6" fill="url(#pl-grid)"/>
  <rect x="0.5" y="0.5" width="639" height="379" rx="5.5" fill="none" stroke="#263040"/>

  <!-- Top Header Strip -->
  <rect x="0" y="0" width="640" height="34" rx="6" fill="#121822"/>
  <line x1="0" y1="34" x2="640" y2="34" stroke="#263040" stroke-width="1"/>
  <circle cx="18" cy="17" r="4" fill="#ff5f56"/>
  <circle cx="32" cy="17" r="4" fill="#ffbd2e"/>
  <circle cx="46" cy="17" r="4" fill="#27c93f"/>
  <text x="68" y="21" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">PHYSICS_LAB :: NEB_GRADE_11_12_ENGINE</text>
  <text x="622" y="21" text-anchor="end" fill="#39d353" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">4 SIMS | OFFLINE-FIRST</text>

  <!-- Panel Divider -->
  <line x1="416" y1="48" x2="416" y2="354" stroke="#263040" stroke-width="1" stroke-dasharray="4 4"/>

  <!-- LEFT PANEL: 2D Projectile Motion & Kinematics -->
  <text x="24" y="58" fill="#58a6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="bold">01 // PROJECTILE_KINEMATICS</text>

  <!-- Coordinate Axes -->
  <line x1="48" y1="90" x2="48" y2="314" stroke="#48556a" stroke-width="1.5"/>
  <line x1="42" y1="308" x2="392" y2="308" stroke="#48556a" stroke-width="1.5"/>
  <text x="48" y="81" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">y (m)</text>
  <text x="394" y="324" text-anchor="end" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">x (m)</text>

  <!-- Origin -->
  <circle cx="48" cy="308" r="3.5" fill="#e6edf3"/>
  <text x="38" y="324" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">(0,0)</text>

  <!-- Launch angle arc -->
  <path d="M 88 308 A 40 40 0 0 0 79 283" fill="none" stroke="#ff9f43" stroke-width="1.5"/>
  <text x="95" y="294" fill="#ff9f43" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">theta</text>

  <!-- Parabolic Trajectory -->
  <path d="M 48 308 Q 204 28 360 308" fill="none" stroke="#39d353" stroke-width="2.5"/>
  <path d="M 48 308 Q 204 28 360 308 L 360 308 L 48 308 Z" fill="#39d353" fill-opacity="0.06"/>

  <!-- Apex Height Drop Line -->
  <line x1="204" y1="168" x2="204" y2="308" stroke="#8b949e" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="210" y="242" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">H_max</text>

  <!-- Sample Trajectory Points -->
  <circle cx="126" cy="203" r="4" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="204" cy="168" r="5" fill="#39d353"/>
  <circle cx="282" cy="203" r="4" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
  <circle cx="360" cy="308" r="4" fill="#ff9f43"/>
  <text x="356" y="324" text-anchor="middle" fill="#ff9f43" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">R</text>

  <!-- Initial Velocity Vector v0 -->
  <line x1="48" y1="308" x2="112" y2="218" stroke="#ff9f43" stroke-width="2" marker-end="url(#pl-arrow-amber)"/>
  <text x="66" y="244" fill="#ff9f43" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="bold">v0</text>

  <!-- Velocity Vector Components at Mid-Ascent (126, 203) -->
  <line x1="126" y1="203" x2="178" y2="203" stroke="#58a6ff" stroke-width="1.6" marker-end="url(#pl-arrow-cyan)"/>
  <line x1="126" y1="203" x2="126" y2="152" stroke="#39d353" stroke-width="1.6" marker-end="url(#pl-arrow-green)"/>
  <text x="164" y="218" fill="#58a6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">vx</text>
  <text x="114" y="160" fill="#39d353" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">vy</text>

  <!-- Velocity at Apex -->
  <line x1="204" y1="168" x2="262" y2="168" stroke="#58a6ff" stroke-width="1.8" marker-end="url(#pl-arrow-cyan)"/>
  <text x="234" y="158" fill="#58a6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">vy = 0</text>

  <!-- Gravity Vector & Readout -->
  <line x1="282" y1="203" x2="282" y2="252" stroke="#ff9f43" stroke-width="1.6" marker-end="url(#pl-arrow-amber)"/>
  <text x="290" y="236" fill="#ff9f43" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">g</text>

  <!-- Left Bottom Spec Pill -->
  <rect x="24" y="338" width="372" height="24" rx="3" fill="#121822" stroke="#263040"/>
  <text x="34" y="354" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">y(t) = v0*sin(theta)*t - 0.5*g*t^2  |  D-PAD + TOUCH</text>

  <!-- RIGHT PANEL: Spring-Mass Simple Harmonic Oscillator -->
  <text x="434" y="58" fill="#39d353" font-family="'JetBrains Mono', Consolas, monospace" font-size="11" font-weight="bold">02 // SHM_OSCILLATOR</text>

  <!-- Fixed Ceiling Anchor -->
  <rect x="462" y="74" width="128" height="10" rx="2" fill="#263040"/>
  <line x1="472" y1="74" x2="482" y2="66" stroke="#48556a" stroke-width="1.2"/>
  <line x1="494" y1="74" x2="504" y2="66" stroke="#48556a" stroke-width="1.2"/>
  <line x1="516" y1="74" x2="526" y2="66" stroke="#48556a" stroke-width="1.2"/>
  <line x1="538" y1="74" x2="548" y2="66" stroke="#48556a" stroke-width="1.2"/>
  <line x1="560" y1="74" x2="570" y2="66" stroke="#48556a" stroke-width="1.2"/>

  <!-- Spring Coils -->
  <polyline points="526,84 526,96 508,105 544,117 508,129 544,141 508,153 544,165 526,174 526,184"
            fill="none" stroke="#58a6ff" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Equilibrium Marker -->
  <line x1="448" y1="168" x2="604" y2="168" stroke="#48556a" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="580" y="163" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">x=0</text>

  <!-- Mass Block -->
  <rect x="498" y="184" width="56" height="40" rx="4" fill="#162230" stroke="#39d353" stroke-width="2"/>
  <text x="526" y="209" text-anchor="middle" fill="#e6edf3" font-family="'JetBrains Mono', Consolas, monospace" font-size="13" font-weight="bold">m</text>

  <!-- Displacement & Restoring Force Arrows -->
  <line x1="478" y1="168" x2="478" y2="204" stroke="#ff9f43" stroke-width="1.4"/>
  <text x="454" y="191" fill="#ff9f43" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">dx</text>
  <line x1="566" y1="210" x2="566" y2="178" stroke="#39d353" stroke-width="1.8" marker-end="url(#pl-arrow-green)"/>
  <text x="574" y="196" fill="#39d353" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">F=-kx</text>

  <!-- Live Sinusoidal Phase Plot -->
  <rect x="434" y="248" width="188" height="80" rx="4" fill="#0b1017" stroke="#263040"/>
  <line x1="444" y1="288" x2="612" y2="288" stroke="#263040" stroke-width="1"/>
  <path d="M 446 288 C 462 256, 478 256, 494 288 C 510 320, 526 320, 542 288 C 558 256, 574 256, 590 288 L 606 274"
        fill="none" stroke="#39d353" stroke-width="2"/>
  <text x="442" y="262" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9">x(t) = A cos(wt)</text>

  <!-- Right Bottom Spec Pill -->
  <rect x="434" y="338" width="188" height="24" rx="3" fill="#121822" stroke="#263040"/>
  <text x="528" y="354" text-anchor="middle" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="10">RESONANCE | W = F*d</text>
</svg>
