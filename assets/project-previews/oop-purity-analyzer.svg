<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="oop-title oop-desc">
  <title id="oop-title">OOP Purity Analyzer Pipeline Diagram</title>
  <desc id="oop-desc">Architecture pipeline illustration: GitHub Repository feeds Code Analysis into a 7-Category, 24-Sub-Criterion Rubric, producing Interactive Analytics and PDF Reports.</desc>
  <defs>
    <marker id="oop-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#39d353"/>
    </marker>
  </defs>

  <rect width="640" height="380" rx="6" fill="#0d1117"/>
  <rect x="0.5" y="0.5" width="639" height="379" rx="5.5" fill="none" stroke="#263040"/>

  <!-- Top Header -->
  <rect x="0" y="0" width="640" height="34" rx="6" fill="#121822"/>
  <line x1="0" y1="34" x2="640" y2="34" stroke="#263040"/>
  <text x="20" y="21" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="11">OOP_PURITY_ANALYZER // EVALUATION_PIPELINE</text>
  <text x="620" y="21" text-anchor="end" fill="#58a6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5">7 CATS | 24 SUB-CRITERIA</text>

  <!-- 5-Stage Horizontal Pipeline -->
  <!-- Stage 1 -->
  <rect x="20" y="58" width="104" height="58" rx="4" fill="#121822" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="72" y="83" text-anchor="middle" fill="#e6edf3" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold">GitHub</text>
  <text x="72" y="100" text-anchor="middle" fill="#58a6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">Repository</text>

  <line x1="124" y1="87" x2="140" y2="87" stroke="#39d353" stroke-width="1.8" marker-end="url(#oop-arrow)"/>

  <!-- Stage 2 -->
  <rect x="142" y="58" width="104" height="58" rx="4" fill="#121822" stroke="#39d353" stroke-width="1.4"/>
  <text x="194" y="83" text-anchor="middle" fill="#e6edf3" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold">Code</text>
  <text x="194" y="100" text-anchor="middle" fill="#39d353" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">Analysis</text>

  <line x1="246" y1="87" x2="262" y2="87" stroke="#39d353" stroke-width="1.8" marker-end="url(#oop-arrow)"/>

  <!-- Stage 3 -->
  <rect x="264" y="58" width="112" height="58" rx="4" fill="#121822" stroke="#ff9f43" stroke-width="1.6"/>
  <text x="320" y="83" text-anchor="middle" fill="#e6edf3" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold">7-Category</text>
  <text x="320" y="100" text-anchor="middle" fill="#ff9f43" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">Rubric</text>

  <line x1="376" y1="87" x2="392" y2="87" stroke="#39d353" stroke-width="1.8" marker-end="url(#oop-arrow)"/>

  <!-- Stage 4 -->
  <rect x="394" y="58" width="104" height="58" rx="4" fill="#121822" stroke="#58a6ff" stroke-width="1.4"/>
  <text x="446" y="83" text-anchor="middle" fill="#e6edf3" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold">Analytics</text>
  <text x="446" y="100" text-anchor="middle" fill="#58a6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">Plotly + DB</text>

  <line x1="498" y1="87" x2="514" y2="87" stroke="#39d353" stroke-width="1.8" marker-end="url(#oop-arrow)"/>

  <!-- Stage 5 -->
  <rect x="516" y="58" width="104" height="58" rx="4" fill="#121822" stroke="#39d353" stroke-width="1.4"/>
  <text x="568" y="83" text-anchor="middle" fill="#e6edf3" font-family="'JetBrains Mono', Consolas, monospace" font-size="10" font-weight="bold">PDF</text>
  <text x="568" y="100" text-anchor="middle" fill="#39d353" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">Report</text>

  <!-- Lower Panel Left: 7-Category Rubric Breakdown -->
  <rect x="20" y="142" width="386" height="214" rx="4" fill="#0b1017" stroke="#263040"/>
  <text x="34" y="164" fill="#ff9f43" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="bold">RUBRIC MATRIX // 7 CATEGORIES (24 SUB-CRITERIA)</text>
  <line x1="34" y1="172" x2="392" y2="172" stroke="#1e2736"/>

  <!-- 7 Schematic Metric Bars -->
  <text x="34" y="194" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">01. Encapsulation</text>
  <rect x="174" y="185" width="212" height="8" rx="2" fill="#161b22"/>
  <rect x="174" y="185" width="176" height="8" rx="2" fill="#39d353"/>

  <text x="34" y="218" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">02. Inheritance</text>
  <rect x="174" y="209" width="212" height="8" rx="2" fill="#161b22"/>
  <rect x="174" y="209" width="154" height="8" rx="2" fill="#58a6ff"/>

  <text x="34" y="242" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">03. Polymorphism</text>
  <rect x="174" y="233" width="212" height="8" rx="2" fill="#161b22"/>
  <rect x="174" y="233" width="164" height="8" rx="2" fill="#39d353"/>

  <text x="34" y="266" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">04. Abstraction</text>
  <rect x="174" y="257" width="212" height="8" rx="2" fill="#161b22"/>
  <rect x="174" y="257" width="142" height="8" rx="2" fill="#58a6ff"/>

  <text x="34" y="290" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">05. Cohesion</text>
  <rect x="174" y="281" width="212" height="8" rx="2" fill="#161b22"/>
  <rect x="174" y="281" width="170" height="8" rx="2" fill="#39d353"/>

  <text x="34" y="314" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">06. SOLID Principles</text>
  <rect x="174" y="305" width="212" height="8" rx="2" fill="#161b22"/>
  <rect x="174" y="305" width="136" height="8" rx="2" fill="#ff9f43"/>

  <text x="34" y="338" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">07. Structure &amp; Docs</text>
  <rect x="174" y="329" width="212" height="8" rx="2" fill="#161b22"/>
  <rect x="174" y="329" width="184" height="8" rx="2" fill="#39d353"/>

  <!-- Lower Panel Right: Stack Capabilities -->
  <rect x="422" y="142" width="198" height="214" rx="4" fill="#0b1017" stroke="#263040"/>
  <text x="436" y="164" fill="#58a6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="10.5" font-weight="bold">SYSTEM OUTPUTS</text>
  <line x1="436" y1="172" x2="606" y2="172" stroke="#1e2736"/>

  <rect x="436" y="188" width="170" height="36" rx="3" fill="#121822" stroke="#263040"/>
  <text x="446" y="204" fill="#39d353" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">REST API + Flask</text>
  <text x="446" y="218" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5">Repo &amp; batch endpoints</text>

  <rect x="436" y="236" width="170" height="36" rx="3" fill="#121822" stroke="#263040"/>
  <text x="446" y="252" fill="#58a6ff" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">SQLite Persistence</text>
  <text x="446" y="266" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5">Historical comparisons</text>

  <rect x="436" y="284" width="170" height="36" rx="3" fill="#121822" stroke="#263040"/>
  <text x="446" y="300" fill="#ff9f43" font-family="'JetBrains Mono', Consolas, monospace" font-size="9.5">ReportLab PDF</text>
  <text x="446" y="314" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5">Structured export report</text>

  <text x="436" y="342" fill="#8b949e" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5">GitHub API integration</text>
</svg>

