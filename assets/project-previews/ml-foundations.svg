  <text x="576" y="280" text-anchor="end" fill="#39d353" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5">capability</text>
  <text x="576" y="312" text-anchor="end" fill="#ff9f43" font-family="'JetBrains Mono', Consolas, monospace" font-size="8.5">loss</text>
